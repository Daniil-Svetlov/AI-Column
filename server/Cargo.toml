[package]
name = "ai-column-server"
version = "0.2.0"
edition = "2024"
description = "Сервер умной колонки AI-Column: речь → агенты (Claude, Qwen, Kimi и др.) → речь"
license = "MIT"
default-run = "ai-column-server"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
fancy-regex = "0.14"
chrono = "0.4"
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
mdns-sd = "0.13"
dotenvy = "0.15"
hostname = "0.4"
urlencoding = "2"
tokio-tungstenite = "0.26"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
