[package]
name = "ai-column-fw"
version = "0.2.0"
edition = "2021"
description = "Прошивка умной колонки AI-Column для ESP32-S3 (ESP-IDF, std)"
license = "MIT"

[[bin]]
name = "ai-column-fw"
harness = false

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
column-core = { path = "../core" }
esp-idf-svc = "0.53"
log = "0.4"
anyhow = "1"
serde_json = "1"
embedded-graphics = "0.8"
mipidsi = "0.10"
embedded-hal = "1"
embedded-hal-bus = "0.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml-cfg = "0.2"

[build-dependencies]
embuild = "0.33"
toml-cfg = "0.2"
