; AI-Column — прошивка для ESP32-S3-DevKitC-1 N16R8 (16 МБ Flash, 8 МБ PSRAM OPI)
; Сборка:   pio run            Прошивка: pio run -t upload        Монитор: pio device monitor
; Тесты логики на ПК: pio test -e native

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ ^6.9.0          ; Arduino-ESP32 2.0.17
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi ; N16R8: QIO Flash + Octal PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3                     ; 0 — тихо, 3 — info, 4 — debug
  -DARDUINO_USB_CDC_ON_BOOT=0              ; лог в порт «UART/COM»
build_src_filter = +<*>
lib_deps =
  lovyan03/LovyanGFX @ ^1.2.0
  links2004/WebSockets @ ^2.6.1
  bblanchon/ArduinoJson @ ^7.2.0
  adafruit/Adafruit NeoPixel @ ^1.12.3

; Юнит-тесты чистой логики (dsp.h, ring_buffer.h) на компьютере
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude
test_build_src = no
