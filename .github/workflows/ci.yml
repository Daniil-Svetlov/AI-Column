name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
      - run: cargo run --locked -- check-config || true   # без живых агентов — только проверка конфига

  firmware-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/core
      - run: cargo test

  firmware-esp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - uses: actions/cache@v4
        with:
          path: |
            firmware/esp/.embuild
            firmware/esp/target
          key: esp-${{ hashFiles('firmware/esp/Cargo.lock', 'firmware/esp/sdkconfig.defaults') }}
      - run: cp cfg.example.toml cfg.toml
      - run: cargo build --release
      - run: cargo install espflash --locked
      - run: |
          espflash save-image --chip esp32s3 --flash-size 16mb --partition-table partitions.csv target/xtensa-esp32s3-espidf/release/ai-column-fw ai-column-fw.bin
          espflash save-image --chip esp32s3 --flash-size 16mb --partition-table partitions.csv target/xtensa-esp32s3-espidf/release/hwtest hwtest.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/esp/*.bin
